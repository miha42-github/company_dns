[package]
name = "edgar-spike"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "edgar-spike"
path = "src/main.rs"

[dependencies]
edgarkit = "0.4.0"
tokio = { version = "1", features = ["full"] }
# Only used to independently verify the accession-number/URL derived
# from IndexEntry actually resolves on sec.gov - not part of edgarkit
# itself, deliberately kept separate so this check isn't trusting the
# same code path it's meant to validate.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
