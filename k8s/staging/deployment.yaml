apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-dns
  namespace: company-dns-staging
  labels:
    app.kubernetes.io/name: company-dns
spec:
  # Twenty one-core replicas, for the hackathon load: at equal CPU, many ~1-core pods beat a few large ones, and lookups kept scaling
  # with pod count up to 20 (docs/plans/v4-sizing-test.md). Production's V3 keeps its own size until V3 is retired.
  # COMPANY_DNS_REPLICAS below must equal this: k8s/test_staging_manifests.py checks it.
  replicas: 20
  selector:
    matchLabels:
      app.kubernetes.io/name: company-dns
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 4       # 20 pods one at a time would take many minutes; four extra at once, still none unavailable
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: company-dns
    spec:
      # Spread the pods across the two worker nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: company-dns
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001            # lets the non-root user read the mounted Secret
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

      # The image package is public: no imagePullSecrets (docs/plans/v4-staging-rollout.md, S1).
      containers:
        - name: company-dns
          # ghcr.io/miha42-github/company_dns/company_dns_v4:<tag>. The tag is put in by scripts/build-and-deploy-v4.sh as it applies this file, on every
          # deploy (never edit it by hand, never `latest`). UNSET is deliberately not pullable.
          image: ghcr.io/miha42-github/company_dns/company_dns_v4:UNSET
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          env:
            # The Deployment's replicas: the fleet-wide rate limits are divided by it.
            - name: COMPANY_DNS_REPLICAS
              value: "20"
            # Per-IP quotas for callers that identify themselves (fleet-wide, divided across the replicas: 600 over 20 pods is 30 each).
            # The anonymous tier stays at its default of 5 per minute. See v4/README.md.
            - name: COMPANY_DNS_RATE_LIMIT_PER_MINUTE
              value: "6000"
            - name: COMPANY_DNS_RATE_LIMIT_BURST
              value: "600"
            # The experimental SQL endpoint is ON in staging only, for the capacity test. Its limits are the
            # defaults until that test sets them (v4/README.md, "Experimental: SQL endpoint").
            - name: COMPANY_DNS_SQL_ENABLED
              value: "true"
            - name: COMPANY_DNS_CREDENTIALS_FILE
              value: /etc/company-dns/credentials/credentials
            - name: COMPANY_DNS_RULES_FILE
              value: /etc/company-dns/rules/rules.json
            - name: LOG_LEVEL_CONFIG_PATH
              value: /etc/company-dns-log-level/log-level
            # COMPANY_DNS_CORS_ORIGINS is left at its default (mediumroast.io, its subdomains and localhost may call
            # the SQL route from a browser; lookups answer any origin).

          # One core per pod, as the sizing test measured (peak memory about 250 MiB, so 1Gi has room). The CPU request is half the limit,
          # so 20 pods reserve 10 cores and the other workloads on these nodes are not crowded out; raise it to 1000m to reserve all 20.
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          # The model and data load at start (1 to 2 s measured on the nodes); the startup probe allows a minute.
          startupProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # proven: the image starts, answers lookups and embedding searches with a read-only root
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: credentials
              mountPath: /etc/company-dns/credentials
              readOnly: true
            - name: rules
              mountPath: /etc/company-dns/rules
              readOnly: true
            # A directory mount, not subPath, so an edit to the ConfigMap reaches the pod.
            - name: log-level
              mountPath: /etc/company-dns-log-level
              readOnly: true

      volumes:
        # Staging's own credentials (profile:sha256 lines), sealed (WP4). Never prod's.
        - name: credentials
          secret:
            secretName: company-dns-credentials
            defaultMode: 0440
        - name: rules
          configMap:
            name: company-dns-rules
        - name: log-level
          configMap:
            name: company-dns-log-level
