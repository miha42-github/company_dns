apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-dns
  namespace: company-dns
  labels:
    app.kubernetes.io/name: company-dns
spec:
  # 4 is a deliberate ceiling (docs/plans/performance-improvements.md, item 3),
  # not "as many as fit" - don't raise this without revisiting that decision.
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: company-dns
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: company-dns
    spec:
      # Spread pods across the two worker nodes (cafe-1 and espresso-1)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: company-dns
                topologyKey: kubernetes.io/hostname

      # No imagePullSecrets: ghcr.io/miha42-github/company_dns/company_dns is a
      # public package (confirm this stays true before any future refactor).

      containers:
        - name: company-dns
          # Format: ghcr.io/miha42-github/company_dns/company_dns:<tag>
          # The image tag below is bumped by scripts/build-and-deploy.sh on every
          # deploy (sed-replaced) - do not edit it by hand, and do not point it at
          # :latest (see docs/plans/onprem-k8s-migration.md, "Image tagging").
          image: ghcr.io/miha42-github/company_dns/company_dns:09262026-4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          env:
            - name: COMPANY_DNS_HOST
              value: "company-dns.mediumroast.io"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
